{% extends "admin/base.html" %}

{% block title %}{{ title }} | Sprouts Box Control Center{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="/static/css/admin_custom.css">
<script src="https://unpkg.com/feather-icons"></script>
{% endblock %}

{% block branding %}
<div class="admin-branding-wrap">
    <a href="{% url 'admin:index' %}" class="admin-logo-link">
        <div class="admin-brand-icon">🌱</div>
        <div class="admin-title-box">
            <span class="admin-title-text">Sprouts Box</span>
            <span class="admin-subtitle-text">Control Center &bull; v2.0</span>
        </div>
    </a>
    <div class="admin-top-actions">
        <span class="system-status-pill">
            <span class="pulse-dot"></span>
            <span>Live &amp; Connected</span>
        </span>
        <a href="{% url 'admin:store_product_add' %}" class="quick-add-btn">
            <span>+ Add Product</span>
        </a>
        <a href="{% url 'store:home' %}" target="_blank" class="live-site-badge">
            <span>View Live Website</span>
            <span class="arrow-up-right">↗</span>
        </a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof feather !== 'undefined') {
            feather.replace();
        }
    });
</script>
{% endblock %}
