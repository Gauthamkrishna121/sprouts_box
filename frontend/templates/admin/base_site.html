{% extends "admin/base.html" %}

{% block title %}{{ title }} | Sprouts Box Admin{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="/static/css/admin_custom.css">
{% endblock %}

{% block branding %}
<div class="admin-branding-wrap">
    <a href="{% url 'admin:index' %}" class="admin-logo-link">
        <img src="/static/plugin/images/logo.png" alt="Sprouts Box Logo" class="admin-logo-img" onerror="this.src='https://placehold.co/120x40/1B4332/FFFFFF?text=Sprouts+Box'">
        <span class="admin-title-text">Lush &amp; Healthy Control Center</span>
    </a>
    <a href="{% url 'store:home' %}" target="_blank" class="live-site-badge">View Live Website ↗</a>
</div>
{% endblock %}
